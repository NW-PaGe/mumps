# washington/config.yaml
# Purpose of config.yaml is that is provides per-build settings/parameters used at each workflow step. 
# Tells augur what query/filtering to apply, how many sequences to include, which traits to reconstruct, how to refine the tree, etc.

# Tell Snakemake which build(s) to run
builds:
  - washington

# Auspice export settings (override defaults)
export:
  auspice_config: washington/auspice_config.json
  description: washington/description.md
  lat_longs: ../defaults/lat_longs.tsv

# Color schemes (used for Auspice visualization)
colors:
  color_schemes: ../defaults/color_schemes.tsv
  color_orderings: ../defaults/color_orderings.tsv

# FIXME: use this?
# Subsampling (points to WA-specific scheme)
subsampling:
  washington: washington/subsampling.yaml

strain_id_field: "accession"

# Subsampling - this is set up to make it easy to do more restrictive subsampling, but the current geography filter limits are > # of available seqs
subsample:
  washington:
    samples:
      context_na:
        exclude: "../defaults/north-america/exclude.txt"
        # no max_sequences
        min_date: 2006
        min_length: 8000
        max_sequences: 4000
        query: "(region=='North America' & ((country!='USA') & (division!='Washington'))) & (MuV_genotype == 'G')"
        exclude_ambiguous_dates_by: "month"
      context_usa:
        exclude: "../defaults/north-america/exclude.txt"
        # no max_sequences
        min_date: 2006
        min_length: 8000
        max_sequences: 4000
        query: "(country=='USA' & (division!='Washington')) & (MuV_genotype == 'G')"
        exclude_ambiguous_dates_by: "month"
      washington:
        include: "../washington/include.txt" # To ensure reference genome is in WA dataset
        exclude: "../defaults/north-america/exclude.txt"
        # no max_sequences
        min_date: 2006
        min_length: 8000
        max_sequences: 99999
        query: "(division=='Washington') & (MuV_genotype == 'G')"
        exclude_ambiguous_dates_by: "month"

# Traits: space-separated column names, as a single string
traits:
  washington: >-
    --columns country division
    --sampling-bias-correction 2.5
    --confidence

# Refine: CLI flags as a single string. This calibratess branch lengths, run clock filtering, infer marginal dates. 
refine:
  washington: >-
    --clock-filter-iqd 4
    --date-inference marginal
    --timetree
    --date-confidence
    --divergence-units "mutations"
  
  
# Ancestral: reconstruct states at internal nodes, including the root. 
# To do: change to Fixed root (use KM597072, which is the default) to allow for Nextclade compatability while still matching the original build's intended reference. 
ancestral:
  root_sequence: "reference.gb"
  washington: >-
    --inference "joint"

# Translate: not used here, keep empty string. Do not add a reference: so that the build will use the original repos refernce. Will break if hard-coded here. 
translate:
  washington: ""

# Tip frequencies 
tip_frequencies:
  washington: >-
    --min-date 2006
    --narrow-bandwidth 0.25
    --proportion-wide 0.0
    --method kde
    --pivot-interval 3
    --pivot-interval-units "months"
